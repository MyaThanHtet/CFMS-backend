name: cfms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cfms
      POSTGRES_PASSWORD: cfms
      POSTGRES_DB: cfms
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cfms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfms -d cfms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: cfms-backend-api
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://cfms:cfms@postgres:5432/cfms
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  cfms_postgres:

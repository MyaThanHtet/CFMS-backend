name: cfms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cfms
      POSTGRES_PASSWORD: cfms
      POSTGRES_DB: cfms
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cfms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfms -d cfms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: cfms-backend-api
    build: .
    ports:
      - "${CFMS_PORT:-4000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://cfms:cfms@postgres:5432/cfms
      BYTECRAFT_ISSUER: ${BYTECRAFT_ISSUER:-}
      BYTECRAFT_APP_CODE: ${BYTECRAFT_APP_CODE:-cfms}
      BYTECRAFT_CLIENT_IDS: ${BYTECRAFT_CLIENT_IDS:-}
      BYTECRAFT_ANDROID_CLIENT_ID: ${BYTECRAFT_ANDROID_CLIENT_ID:-}
      BYTECRAFT_IOS_CLIENT_ID: ${BYTECRAFT_IOS_CLIENT_ID:-}
      BYTECRAFT_REDIRECT_URI: ${BYTECRAFT_REDIRECT_URI:-com.cfms.mobile:/oauth2redirect}
      BYTECRAFT_WEBHOOK_CLIENT_ID: ${BYTECRAFT_WEBHOOK_CLIENT_ID:-}
      BYTECRAFT_WEBHOOK_SECRET: ${BYTECRAFT_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  cfms_postgres:
